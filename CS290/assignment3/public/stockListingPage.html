	<form action="/orderStocks" method="GET" id="purchaseForm">

			<label for="stock5">TDC</label><br><br>
            </label>
            <br />
            <label>Quantity:
                <input type="number" name="stockQty" size="30" maxlength="100" required="required">
            </label>
            <br />
        </fieldset>
        <button type="submit">Submit Purchase</button>
    </form>
